<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EaglesOS · Tactical Shell</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root { --bg:#000; --fg:#1fe05a; --dim:#166a34; --bad:#ff4d4d; --warn:#e8c547; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; }
  body {
    font: 14px/1.5 "Courier New", Courier, monospace; color: var(--fg); background: #000;
    padding: 10px 12px env(safe-area-inset-bottom,10px) 10px;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  #out { flex: 1; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  #out .dim { color: var(--dim); }
  #out .ok { color: var(--fg); }
  #out .err { color: var(--bad); }
  #out .warn { color: var(--warn); }
  #out .cmd { color: #c9ffd6; }
  .linha-cmd { display: flex; gap: 8px; align-items: center; padding-top: 6px; flex: none; }
  #ps { white-space: nowrap; color: var(--fg); }
  #in { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--fg); font: inherit; caret-color: var(--fg); }
  #in.blind { -webkit-text-security: disc; text-security: disc; }
  #in::selection { background: var(--fg); color: #000; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--dim); }
  ::-webkit-scrollbar-track { background: #000; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<pre id="out"></pre>
<div class="linha-cmd">
  <span id="ps">guest@eagles:~$</span>
  <input id="in" type="text" autocomplete="off" spellcheck="false" autocapitalize="off" aria-label="Comando" disabled>
</div>

<script>
  /* ===== Configuração (mesmo projeto do admin.html / command-post.html) ===== */
  const SUPABASE_URL = "COLE_AQUI_A_URL_DO_SEU_PROJETO_SUPABASE";
  const SUPABASE_ANON_KEY = "COLE_AQUI_A_CHAVE_ANON_PUBLIC";
  const COMMAND_POST_URL = "command-post.html";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const out = document.getElementById("out");
  const inp = document.getElementById("in");
  const ps  = document.getElementById("ps");

  function print(txt, cls) {
    const d = document.createElement("div");
    if (cls) d.className = cls;
    d.textContent = txt;
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
  }
  function printLines(lines, cls) { lines.forEach(l => print(l, cls)); }

  /* ===== Camada narrativa (não é segurança real — veja aviso abaixo) =====
     O portão de verdade já aconteceu: só chega até aqui quem autenticou no
     command-post.html com uma conta de cargo "comando" no Supabase. Este
     "ssh" dentro do terminal é só a ambientação tática do EaglesOS. */
  const HOST_ESPERADO = "192.168.0.1@techadsumus";
  const SENHA_ESPERADA = "N0tpetya!!";

  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  const hora = (iso) => new Date(iso).toLocaleTimeString("pt-BR");
  const pad = (s, n) => (s || "").toString().slice(0, n).padEnd(n, " ");

  let meuId = null, meuNome = "comando";
  let modo = "boot";       // boot -> guest -> senha -> auth
  let following = false, liveCanal = null, livePoll = null;
  let historico = [], hi = 0;
  let cacheTentativas = [];

  /* ===== Boot ===== */
  const BOOT = [
    [450, "EaglesOS Tactical Kernel v4.1 — Border Eagles Unidade #36809", "dim"],
    [550, "Starting secure intel partition mount...", "dim"],
    [480, "[  OK  ] Mounted secure intel partition", "ok"],
    [650, "Starting Border Watch perimeter daemon...", "dim"],
    [600, "[  OK  ] Started Border Watch perimeter daemon", "ok"],
    [500, "Starting satellite uplink handshake...", "dim"],
    [850, "[  OK  ] Satellite uplink established", "ok"],
    [420, "Starting access audit subsystem (syslog)...", "dim"],
    [480, "[  OK  ] Started access audit subsystem", "ok"],
    [480, "Mounting identity vault (users.db)...", "dim"],
    [600, "[  OK  ] Mounted identity vault", "ok"],
    [550, "Starting run0 privilege broker...", "dim"],
    [650, "[  OK  ] Started run0 privilege broker", "ok"],
    [750, "Checking tactical integrity... 100%", "dim"],
    [480, "[  OK  ] System integrity verified", "ok"],
    [550, "Starting EaglesOS command shell...", "dim"],
    [380, "[  OK  ] Started EaglesOS command shell", "ok"]
  ];
  function boot(i) {
    if (i >= BOOT.length) return setTimeout(motd, 350);
    const [delay, txt, cls] = BOOT[i];
    setTimeout(() => { print(txt, cls); boot(i + 1); }, delay);
  }
  function motd() {
    print("");
    print("EaglesOS v4.1-tactical — ACESSO RESTRITO. Toda atividade é monitorada e auditada.", "dim");
    print("Autentique-se com: ssh " + HOST_ESPERADO, "dim");
    print("Digite 'help' a qualquer momento para ver os comandos disponíveis.", "dim");
    print("");
    modo = "guest";
    inp.disabled = false; inp.focus();
  }

  /* ===== Entrada ===== */
  document.addEventListener("click", () => inp.focus());
  inp.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") { if (hi > 0) { hi--; inp.value = historico[hi] || ""; } e.preventDefault(); return; }
    if (e.key === "ArrowDown") { hi = Math.min(hi + 1, historico.length); inp.value = historico[hi] || ""; e.preventDefault(); return; }
    if (e.key !== "Enter") return;
    e.preventDefault();
    const valor = inp.value;
    inp.value = "";
    processar(valor);
  });

  async function processar(valorBruto) {
    if (modo === "senha") {
      print(ps.textContent + " " + "•".repeat(valorBruto.length), "cmd");
      inp.classList.remove("blind"); inp.type = "text";
      if (valorBruto === SENHA_ESPERADA) {
        print("AUTH OK // credencial validada. Bem-vindo, " + meuNome + ".", "ok");
        ps.textContent = "comando@eagles:~$";
        modo = "auth";
      } else {
        print("ERR-401 // credencial rejeitada.", "err");
        ps.textContent = "guest@eagles:~$";
        modo = "guest";
      }
      return;
    }

    const raw = valorBruto.trim();
    if (!raw) return;
    historico.push(valorBruto); hi = historico.length;

    if (following) {
      pararFollow();
      print("-- fim do modo ao vivo --", "dim");
      return;
    }

    print(ps.textContent + " " + raw, "cmd");
    await rodar(raw);
  }

  async function rodar(raw) {
    const p = raw.split(/\s+/);
    const c = p[0].toLowerCase();

    if (c === "help") {
      printLines([
        "Comandos disponíveis:",
        "  ssh <host>                                    inicia autenticação",
        "  whoami                                        identidade atual",
        "  clear                                         limpa a tela",
        "  logout                                        encerra a sessão",
        "  run0 bordercommand --syslog [--follow]        audita acessos em tempo real",
        "  run0 bordercommand --usersdb                  lista identidades registradas",
        "  run0 bordercommand --roleuser -C|-X <nome>    concede/revoga COMANDO"
      ], "dim");
      return;
    }
    if (c === "clear") { out.replaceChildren(); return; }
    if (c === "whoami") { print(modo === "auth" ? meuNome + " [COMANDO]" : "guest [NÃO AUTENTICADO]"); return; }
    if (c === "logout") {
      pararFollow();
      await sb.auth.signOut();
      print("Sessão encerrada. Redirecionando ao Command Post...", "warn");
      setTimeout(() => { window.location.href = COMMAND_POST_URL; }, 900);
      return;
    }
    if (c === "ssh") {
      const host = p[1] || "";
      if (norm(host) !== norm(HOST_ESPERADO)) {
        print("ERR-401 // host desconhecido. Uso: ssh " + HOST_ESPERADO, "err");
        return;
      }
      print("Password:", "dim");
      modo = "senha"; ps.textContent = "";
      inp.type = "password"; inp.classList.add("blind");
      return;
    }
    if (c === "bordercommand") {
      print("ERR-403 // privilégio insuficiente: comando exige elevação via run0.", "err");
      return;
    }
    if (c === "run0" && (p[1] || "").toLowerCase() === "bordercommand") { await bordercommand(p.slice(2)); return; }

    print("ERR-400 // comando não reconhecido “" + p[0].slice(0, 24) + "”. Digite help.", "err");
  }

  function pararFollow() {
    following = false;
    if (liveCanal) { sb.removeChannel(liveCanal); liveCanal = null; }
    if (livePoll) { clearInterval(livePoll); livePoll = null; }
    ps.textContent = (modo === "auth" ? "comando" : "guest") + "@eagles:~$";
  }

  function linhaLog(t) {
    const linha = "[" + hora(t.criado_em) + "] " + pad(t.alvo, 13) + pad(t.nome_tentado, 19) + (t.sucesso ? "200 OK" : "403 DENIED");
    print(linha, t.sucesso ? "ok" : "err");
  }

  async function bordercommand(args) {
    if (modo !== "auth") { print("ERR-403 // acesso negado: sessão não autenticada. Use ssh " + HOST_ESPERADO + ".", "err"); return; }
    const flag = args[0];

    if (flag === "--syslog") {
      const { data, error } = await sb.from("tentativas_acesso").select("*").order("criado_em", { ascending: false }).limit(15);
      if (error) { print("ERR-500 // falha ao consultar system.log: " + error.message, "err"); return; }
      cacheTentativas = (data || []).slice().reverse();

      if (args[1] === "--follow") {
        print("-- MODO AO VIVO (system.log) — pressione ENTER para encerrar --", "dim");
        cacheTentativas.forEach(linhaLog);
        following = true; ps.textContent = "[LIVE]";
        liveCanal = sb.channel("eaglesos-syslog")
          .on("postgres_changes", { event: "INSERT", schema: "public", table: "tentativas_acesso" }, (payload) => linhaLog(payload.new))
          .subscribe();
        livePoll = setInterval(async () => {
          const { data: d2 } = await sb.from("tentativas_acesso").select("*").order("criado_em", { ascending: false }).limit(1);
          // fallback silencioso: o canal realtime normalmente já cobre isso
        }, 20000);
        return;
      }
      print("-- system.log (últimas " + cacheTentativas.length + " entradas; use --follow para tempo real) --", "dim");
      cacheTentativas.forEach(linhaLog);
      return;
    }

    if (flag === "--usersdb") {
      const { data, error } = await sb.from("operadores").select("nome, email, role").order("nome");
      if (error) { print("ERR-500 // falha ao consultar users.db: " + error.message, "err"); return; }
      print("-- users.db (" + (data || []).length + " identidades) --", "dim");
      print(pad("NOME", 20) + pad("EMAIL", 29) + "NÍVEL", "dim");
      (data || []).forEach(u => {
        const comando = u.role === "comando";
        const nivel = comando ? "COMANDO" + (u.email && meuEmail === u.email ? " (você)" : "") : "SEM ACESSO";
        print(pad(u.nome || "—", 20) + pad(u.email || "—", 29) + nivel, comando ? "ok" : "dim");
      });
      return;
    }

    if (flag === "--roleuser") {
      const m = (args[1] || "").match(/^-([A-Za-z])$/);
      if (!m) { print("ERR-422 // sintaxe: run0 bordercommand --roleuser -C|-X <nome>", "err"); return; }
      const fl = m[1].toUpperCase();
      if (fl !== "C" && fl !== "X") { print("ERR-422 // flag inválida “-" + m[1] + "”. Suportadas: -C (conceder), -X (revogar).", "err"); return; }
      const nome = args.slice(2).join(" ");
      if (!nome) { print("ERR-422 // nome de usuário não informado.", "err"); return; }

      const { data: candidatos, error: e1 } = await sb.from("operadores").select("id, nome, role").ilike("nome", nome);
      if (e1) { print("ERR-500 // falha ao consultar users.db: " + e1.message, "err"); return; }
      const alvo = (candidatos || []).find(u => norm(u.nome) === norm(nome)) || (candidatos || [])[0];
      if (!alvo) { print("ERR-404 // usuário “" + nome.slice(0, 30) + "” não encontrado em users.db.", "err"); return; }
      if (alvo.id === meuId && fl === "X") { print("ERR-403 // operação bloqueada: não é permitido revogar a própria identidade.", "err"); return; }

      const antes = alvo.role === "comando" ? "COMANDO" : "SEM ACESSO";
      const novoRole = (fl === "C") ? "comando" : "operador";
      const { error: e2 } = await sb.from("operadores").update({ role: novoRole }).eq("id", alvo.id);
      if (e2) { print("ERR-500 // falha ao alterar cargo: " + e2.message, "err"); return; }
      const depois = novoRole === "comando" ? "COMANDO" : "SEM ACESSO";
      print("200 OK // " + alvo.nome + ": " + antes + " → " + depois, "ok");
      return;
    }

    print("ERR-400 // flag desconhecida. Use --syslog, --usersdb ou --roleuser.", "err");
  }

  /* ===== Portão real: exige sessão com cargo "comando" ===== */
  let meuEmail = null;
  (async function iniciar() {
    const { data } = await sb.auth.getSession();
    if (!data || !data.session) { window.location.href = COMMAND_POST_URL; return; }
    const { data: perfil } = await sb.from("operadores").select("role, nome, email").eq("id", data.session.user.id).maybeSingle();
    if (!perfil || perfil.role !== "comando") {
      await sb.auth.signOut();
      window.location.href = COMMAND_POST_URL;
      return;
    }
    meuId = data.session.user.id;
    meuNome = perfil.nome || "comando";
    meuEmail = perfil.email;
    print("Booting EaglesOS...", "dim");
    boot(0);
  })();
</script>
</body>
</html>
