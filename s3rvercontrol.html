<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EaglesOS · Server Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090a0f;
    --surface: #111319;
    --surface-border: #1e222d;
    --text-main: #d1d5db;
    --text-muted: #6b7280;
    --accent: #3b82f6;
    --accent-dim: rgba(59, 130, 246, 0.1);
    --success: #10b981;
    --success-dim: rgba(16, 185, 129, 0.1);
    --danger: #ef4444;
    --danger-dim: rgba(239, 68, 68, 0.1);
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 24px 16px;
  }

  [hidden] { display: none !important; }
  button, input, select { font: inherit; color: inherit; background: transparent; border: none; }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

  /* Demo Banner Minimalist */
  .demo-banner {
    max-width: 1000px;
    margin: 0 auto 20px;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 4px;
    color: var(--text-muted);
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .demo-banner .dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
  }

  /* App Layout */
  .app {
    max-width: 1000px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 6px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    overflow: hidden;
  }

  /* Header / System Info */
  .sys-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--surface-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    background: rgba(255,255,255,0.01);
  }
  .sys-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sys-brand h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #fff;
  }
  .sys-brand .version {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid var(--surface-border);
  }
  .btn-logout {
    padding: 6px 12px;
    border: 1px solid var(--surface-border);
    border-radius: 4px;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-logout:hover {
    border-color: var(--text-muted);
    color: var(--text-main);
  }

  /* Navigation Tabs */
  .nav-tabs {
    display: flex;
    border-bottom: 1px solid var(--surface-border);
    background: var(--bg);
    padding: 0 12px;
  }
  .tab-btn {
    padding: 10px 16px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s ease;
  }
  .tab-btn:hover { color: var(--text-main); }
  .tab-btn[aria-selected="true"] {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* Content Area */
  .content { padding: 20px; }

  /* Metrics Grid */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .metric-card {
    background: var(--bg);
    border: 1px solid var(--surface-border);
    padding: 12px 16px;
    border-radius: 4px;
  }
  .metric-card .label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
    display: block;
  }
  .metric-card .value {
    font-size: 20px;
    font-weight: 500;
    color: #fff;
  }
  .metric-card.alert {
    border-color: rgba(239, 68, 68, 0.4);
    background: var(--danger-dim);
  }
  .metric-card.alert .value { color: var(--danger); }

  /* Panel & Data Table */
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .panel-title {
    color: var(--text-main);
    font-weight: 500;
  }

  .table-wrapper {
    background: var(--bg);
    border: 1px solid var(--surface-border);
    border-radius: 4px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    white-space: nowrap;
  }
  th {
    padding: 10px 14px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    border-bottom: 1px solid var(--surface-border);
    background: rgba(255,255,255,0.01);
  }
  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--surface-border);
    color: var(--text-main);
    font-size: 12px;
  }
  tr:last-child td { border-bottom: none; }
  tr.falha td { background: rgba(239, 68, 68, 0.02); }
  tr.alerta td:first-child { border-left: 2px solid var(--danger); }
  tr.novo { animation: highlight 1s ease; }

  @keyframes highlight {
    from { background-color: var(--accent-dim); }
  }

  /* Status Chips */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 500;
  }
  .badge.success { background: var(--success-dim); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
  .badge.danger { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }

  /* Controls & Search */
  .search-input {
    width: 100%;
    max-width: 300px;
    background: var(--bg);
    border: 1px solid var(--surface-border);
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--text-main);
    margin-bottom: 16px;
  }
  .search-input:focus { border-color: var(--accent); }

  select.role-select {
    background: var(--bg);
    border: 1px solid var(--surface-border);
    border-radius: 3px;
    padding: 4px 8px;
    font-size: 11px;
    color: var(--text-main);
    cursor: pointer;
  }
  select.role-select:disabled { opacity: 0.5; cursor: not-allowed; }
  .user-self { font-size: 10px; color: var(--accent); margin-left: 6px; }

  @media (max-width: 600px) {
    body { padding: 8px; }
    .metrics-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="demo-banner">
  <span class="dot"></span>
  <span><b>EaglesOS Demo Mode</b> — dados de eventos e monitoramento simulados localmente.</span>
</div>

<div class="app" id="app">
  <header class="sys-header">
    <div class="sys-brand">
      <h1>EaglesOS</h1>
      <span class="version">v2.4.0-sys</span>
    </div>
    <button class="btn-logout" type="button" id="sair">system.exit()</button>
  </header>

  <nav class="nav-tabs" role="tablist">
    <button class="tab-btn" role="tab" id="aba-log" aria-selected="true" type="button">system.log</button>
    <button class="tab-btn" role="tab" id="aba-operadores" aria-selected="false" type="button">users.db</button>
  </nav>

  <div class="content">
    <section id="view-log">
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="label">Total Requests</span>
          <div class="value" id="s-total">0</div>
        </div>
        <div class="metric-card">
          <span class="label">Authorized</span>
          <div class="value" id="s-ok">0</div>
        </div>
        <div class="metric-card">
          <span class="label">Denied</span>
          <div class="value" id="s-fail">0</div>
        </div>
        <div class="metric-card" id="stat-alerta">
          <span class="label">Active Alerts</span>
          <div class="value" id="s-alerta">0</div>
        </div>
      </div>

      <div class="panel-header">
        <span class="panel-title">Realtime Access Audit</span>
        <span id="atualizado">--:--:--</span>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>TIMESTAMP</th>
              <th>RESOURCE</th>
              <th>IDENTITY</th>
              <th>STATUS</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <section id="view-operadores" hidden>
      <input class="search-input" type="search" id="op-busca" placeholder="Filter by user or email...">
      
      <div class="panel-header">
        <span class="panel-title">Registered System Identities</span>
        <span id="op-total">0 records</span>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>USER</th>
              <th>EMAIL</th>
              <th>ROLE</th>
            </tr>
          </thead>
          <tbody id="op-tbody"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  /* ===== Dados fictícios ===== */
  const agora = Date.now();
  let tentativas = [
    { h: agora - 2 * 60e3,  alvo: "intel-brief",   nome: "Operador Silva",   ok: true },
    { h: agora - 6 * 60e3,  alvo: "intel-brief",   nome: "desconhecido",     ok: false },
    { h: agora - 9 * 60e3,  alvo: "intel-brief",   nome: "desconhecido",     ok: false },
    { h: agora - 11 * 60e3, alvo: "intel-brief",   nome: "desconhecido",     ok: false },
    { h: agora - 15 * 60e3, alvo: "command-post",  nome: "Comando",         ok: true },
    { h: agora - 22 * 60e3, alvo: "intel-brief",   nome: "Operador Costa",   ok: true },
    { h: agora - 34 * 60e3, alvo: "intel-brief",   nome: "fulano.teste",     ok: false }
  ];
  const NOMES_FALSOS = ["desconhecido", "admin", "root", "teste123", "operador.x"];

  /* ===== Alternância de Abas ===== */
  $("aba-log").onclick = () => trocarAba("log");
  $("aba-operadores").onclick = () => trocarAba("operadores");
  
  function trocarAba(aba) {
    const op = aba === "operadores";
    $("aba-log").setAttribute("aria-selected", String(!op));
    $("aba-operadores").setAttribute("aria-selected", String(op));
    $("view-log").hidden = op; 
    $("view-operadores").hidden = !op;
    if (op) desenharOperadores();
  }

  /* ===== Operadores / Usuários ===== */
  let operadores = [
    { nome: "Capitão Almeida", email: "almeida@eagles.os", role: "admin", voce: true },
    { nome: "Operador Silva", email: "silva@eagles.os", role: "user" },
    { nome: "Operador Costa", email: "costa@eagles.os", role: "user" },
    { nome: "Sargento Ferreira", email: "ferreira@eagles.os", role: "user" },
    { nome: "Tenente Ramos", email: "ramos@eagles.os", role: "admin" }
  ];

  function desenharOperadores() {
    const f = $("op-busca").value.trim().toLowerCase();
    const lista = operadores.filter(o => !f || o.nome.toLowerCase().includes(f) || o.email.toLowerCase().includes(f));
    const tbody = $("op-tbody"); 
    tbody.replaceChildren();
    
    $("op-total").textContent = operadores.length + " users registered";
    
    lista.forEach(o => {
      const tr = document.createElement("tr");
      
      const tdNome = document.createElement("td"); 
      tdNome.textContent = o.nome;
      if (o.voce) { 
        const v = document.createElement("span"); 
        v.className = "user-self"; 
        v.textContent = "(you)"; 
        tdNome.appendChild(v); 
      }
      
      const tdMail = document.createElement("td"); 
      tdMail.textContent = o.email;
      
      const tdCargo = document.createElement("td");
      const sel = document.createElement("select"); 
      sel.className = "role-select";
      
      [["user", "USER"], ["admin", "ADMIN"]].forEach(([v, n]) => {
        const opt = document.createElement("option"); 
        opt.value = v; 
        opt.textContent = n;
        if (v === o.role) opt.selected = true; 
        sel.appendChild(opt);
      });
      
      sel.disabled = !!o.voce;
      sel.onchange = () => { o.role = sel.value; };
      tdCargo.appendChild(sel);
      
      tr.append(tdNome, tdMail, tdCargo);
      tbody.appendChild(tr);
    });
  }
  
  $("op-busca").addEventListener("input", desenharOperadores);

  /* ===== Renderização de Logs ===== */
  desenhar();
  setInterval(simularNovaTentativa, 9000);
  setInterval(() => { 
    $("atualizado").textContent = new Date().toLocaleTimeString("pt-BR"); 
  }, 1000);

  function contarFalhasRecentes(nome, ateH) {
    const limite = ateH - 3600e3;
    return tentativas.filter(t => t.nome === nome && !t.ok && t.h >= limite && t.h <= ateH).length;
  }

  function desenhar() {
    const ok = tentativas.filter(t => t.ok).length;
    const fail = tentativas.length - ok;
    const nomesAlerta = new Set(tentativas.filter(t => !t.ok && contarFalhasRecentes(t.nome, t.h) >= 3).map(t => t.nome));
    
    $("s-total").textContent = tentativas.length;
    $("s-ok").textContent = ok;
    $("s-fail").textContent = fail;
    $("s-alerta").textContent = nomesAlerta.size;
    $("stat-alerta").classList.toggle("alert", nomesAlerta.size > 0);
    $("atualizado").textContent = new Date().toLocaleTimeString("pt-BR");

    const tbody = $("tbody"); 
    tbody.replaceChildren();
    
    tentativas.slice().sort((a, b) => b.h - a.h).forEach(t => {
      const tr = document.createElement("tr");
      if (!t.ok) tr.className = "falha";
      if (nomesAlerta.has(t.nome)) tr.classList.add("alerta");
      if (t.novo) { tr.classList.add("novo"); delete t.novo; }
      
      const hora = new Date(t.h).toLocaleTimeString("pt-BR");
      tr.innerHTML =
        "<td>" + hora + "</td>" +
        "<td>" + (t.alvo === "command-post" ? "srv-post" : "srv-intel") + "</td>" +
        "<td>" + t.nome.replace(/</g, "&lt;") + "</td>" +
        '<td><span class="badge ' + (t.ok ? "success" : "danger") + '">' + (t.ok ? "200 OK" : "403 DENIED") + "</span></td>";
      tbody.appendChild(tr);
    });
  }

  function simularNovaTentativa() {
    const falha = Math.random() < 0.6;
    const nome = falha ? NOMES_FALSOS[Math.floor(Math.random() * NOMES_FALSOS.length)] : "Operador Silva";
    tentativas.push({ h: Date.now(), alvo: "intel-brief", nome, ok: !falha, novo: true });
    if (tentativas.length > 40) tentativas.shift();
    desenhar();
  }

  $("sair").onclick = () => { alert("EaglesOS Demo: Sessão encerrada no cliente."); };
</script>
</body>
</html>
