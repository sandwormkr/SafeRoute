<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BORDER EAGLES · COMMAND POST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --verde: #27d17c; --verde-dim: #1a8f54; --amarelo: #e8c547; --azul: #3a7bd5;
    --bg: #05070a; --linha: rgba(39, 209, 124, .25); --vermelho: #ff4d4d;
    --font-display: "Black Ops One", "Arial Black", sans-serif;
    --font-mono: "Share Tech Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 700px at 50% 0%, #0d1a10, var(--bg) 70%);
    color: var(--verde); font-family: var(--font-mono);
    min-height: 100%; padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--amarelo); outline-offset: 2px; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2; mix-blend-mode: overlay;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0px, rgba(255,255,255,.03) 1px, transparent 1px, transparent 3px);
  }

  .tela-login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; position: relative; z-index: 3; }
  .term { width: 100%; max-width: 440px; background: linear-gradient(180deg, rgba(10,18,13,.96), rgba(5,8,6,.98));
    border: 1px solid var(--linha); border-radius: 4px; box-shadow: 0 30px 70px rgba(0,0,0,.65); padding: 26px 24px 22px; }
  .faixa { height: 4px; margin: -26px -24px 20px; background: linear-gradient(90deg, var(--verde-dim), var(--amarelo) 50%, var(--azul)); }
  h1 { font-family: var(--font-display); font-size: 20px; text-align: center; letter-spacing: .04em; margin: 4px 0 4px; color: #eaf7ee; }
  .sub { text-align: center; font-size: 12px; color: var(--verde-dim); margin: 0 0 18px; letter-spacing: .08em; }
  form { display: grid; gap: 12px; }
  .prompt { font-size: 12.5px; color: var(--verde-dim); margin-bottom: 4px; }
  .campo { position: relative; }
  .campo input { width: 100%; background: #04100a; border: 1px solid var(--linha); border-radius: 2px; color: #eaf7ee;
    font: 15px var(--font-mono); padding: 11px 44px 11px 12px; outline: 0; }
  .campo input:focus { border-color: var(--verde); box-shadow: 0 0 0 3px rgba(39,209,124,.14); }
  .campo .ver { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: 0;
    color: var(--verde-dim); font-size: 11px; padding: 6px; cursor: pointer; }
  .enviar { margin-top: 4px; padding: 13px 16px; border: 1px solid var(--verde); border-radius: 2px; background: rgba(39,209,124,.1);
    color: var(--verde); font: 700 14px var(--font-mono); letter-spacing: .08em; cursor: pointer; }
  .enviar:hover { background: var(--verde); color: #04100a; }
  .enviar[disabled] { opacity: .55; cursor: progress; }
  .status { min-height: 20px; margin-top: 14px; font-size: 13px; white-space: pre-wrap; }
  .status.ok { color: var(--verde); } .status.erro { color: var(--vermelho); }
  .rodape { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--linha); font-size: 11.5px; color: var(--verde-dim); text-align: center; line-height: 1.6; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>

<section class="tela-login" id="tela-login">
  <main class="term">
    <div class="faixa"></div>
    <h1>COMMAND POST</h1>
    <p class="sub">BORDER EAGLES — UNIDADE #36809</p>
    <form id="f-login" novalidate>
      <div>
        <p class="prompt">comando@fronteira:~$ <b>login --id</b></p>
        <div class="campo"><input id="c-login" type="text" autocomplete="username" placeholder="id do comando" required></div>
      </div>
      <div>
        <p class="prompt">comando@fronteira:~$ <b>login --senha</b></p>
        <div class="campo">
          <input id="c-senha" type="password" autocomplete="current-password" placeholder="••••••••" required>
          <button class="ver" type="button" id="c-ver">MOSTRAR</button>
        </div>
      </div>
      <button class="enviar" type="submit" id="c-enviar">[ENTER] AUTENTICAR</button>
      <div class="status" id="c-status" role="status" aria-live="polite"></div>
    </form>
    <p class="rodape">Acesso restrito a contas de cargo COMANDO.<br>Toda tentativa é registrada e auditável em EaglesOS.</p>
  </main>
</section>

<script>
  /* ===== Configuração (mesmo projeto do admin.html / eaglesos.html) ===== */
  const SUPABASE_URL = "COLE_AQUI_A_URL_DO_SEU_PROJETO_SUPABASE";
  const SUPABASE_ANON_KEY = "COLE_AQUI_A_CHAVE_ANON_PUBLIC";
  const EAGLESOS_URL = "eaglesos.html";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);

  $("c-ver").onclick = () => {
    const s = $("c-senha"); const oculto = s.type === "password";
    s.type = oculto ? "text" : "password";
    $("c-ver").textContent = oculto ? "OCULTAR" : "MOSTRAR";
  };

  function marcar(txt, tipo) { $("c-status").textContent = txt; $("c-status").className = "status" + (tipo ? " " + tipo : ""); }
  async function registrar(nome, sucesso) {
    try { await sb.from("tentativas_acesso").insert({ alvo: "command-post", nome_tentado: nome, sucesso }); } catch (_) {}
  }

  $("f-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const login = $("c-login").value.trim(), senha = $("c-senha").value;
    if (!login || !senha) return marcar("> erro: informe login e senha.", "erro");
    $("c-enviar").disabled = true; marcar("> autenticando...");

    const { data, error } = await sb.auth.signInWithPassword({ email: login, password: senha });
    if (error) {
      await registrar(login, false);
      marcar("> ACESSO NEGADO: credenciais inválidas.", "erro");
      $("c-enviar").disabled = false; return;
    }
    const { data: perfil } = await sb.from("operadores").select("role, nome").eq("id", data.user.id).maybeSingle();
    if (!perfil || perfil.role !== "comando") {
      await registrar(login, false);
      await sb.auth.signOut();
      marcar("> ACESSO NEGADO: nível insuficiente para Command Post.", "erro");
      $("c-enviar").disabled = false; return;
    }
    await registrar(perfil.nome || login, true);
    marcar("> AUTH OK // encaminhando para EaglesOS...", "ok");
    window.location.href = EAGLESOS_URL;
  });

  // Se a sessão já existir (recarregou a página), pula direto para o EaglesOS
  (async function iniciar() {
    const { data } = await sb.auth.getSession();
    if (data && data.session) {
      const { data: perfil } = await sb.from("operadores").select("role").eq("id", data.session.user.id).maybeSingle();
      if (perfil && perfil.role === "comando") window.location.href = EAGLESOS_URL;
      else await sb.auth.signOut();
    }
  })();
</script>
</body>
</html>
